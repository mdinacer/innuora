name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Generate Prisma client
        run: pnpm prisma generate
        
      - name: Run tests (fast)
        run: pnpm test --run --reporter=basic
        env:
          NODE_ENV: test
          
      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: true
          
      - name: Run database migrations (staging)
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          
      - name: Deploy to Vercel (Preview/Staging)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          working-directory: ./
          
      - name: Wait for deployment
        run: sleep 20
        
      - name: Health check staging
        run: |
          curl -f ${{ steps.deploy.outputs.preview-url }}/api/health || echo "Health check failed"
        continue-on-error: true
        
      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = '${{ steps.deploy.outputs.preview-url }}';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Staging deployment is ready!**
              
              **Preview URL**: ${deploymentUrl}
              **Health Check**: ${deploymentUrl}/api/health
              
              📊 **Deployment Info**:
              - **Commit**: \`${context.sha.substring(0, 7)}\`
              - **Branch**: \`${context.ref}\`
              - **Environment**: Staging
              
              🧪 **Test this deployment** by visiting the preview URL above.
              `
            })
            
      - name: Update deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const description = state === 'success' 
              ? 'Staging deployment successful' 
              : 'Staging deployment failed';
              
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              target_url: '${{ steps.deploy.outputs.preview-url }}',
              description: description,
              context: 'staging/deployment'
            });

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps
        
      - name: Run visual regression tests
        run: pnpm exec playwright test --project=chromium
        env:
          BASE_URL: ${{ needs.deploy.outputs.preview-url }}
        continue-on-error: true
        
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7