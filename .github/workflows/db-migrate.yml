name: Database Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to migrate"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      migration_action:
        description: "Migration action to perform"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - reset
          - seed
          - generate
      confirm_production:
        description: 'Type "CONFIRM" to run migrations on production'
        required: false
        type: string

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  validate-production:
    name: Validate Production Migration
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production'

    steps:
      - name: Validate production confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "CONFIRM" ]; then
            echo "❌ Production migrations require confirmation. Please type 'CONFIRM' in the confirm_production input."
            exit 1
          fi
          echo "✅ Production migration confirmed"

  migrate:
    name: Run Database Migration
    runs-on: ubuntu-latest
    needs: [validate-production]
    if: always() && (needs.validate-production.result == 'success' || github.event.inputs.environment == 'staging')
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set database URL
        run: |
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_ENV
          else
            echo "DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" >> $GITHUB_ENV
          fi

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Check database connection
        run: pnpm prisma db pull --print

      - name: Run migration (deploy)
        if: github.event.inputs.migration_action == 'deploy'
        run: pnpm prisma migrate deploy

      - name: Reset database
        if: github.event.inputs.migration_action == 'reset'
        run: pnpm prisma migrate reset --force

      - name: Seed database
        if: github.event.inputs.migration_action == 'seed'
        run: pnpm prisma db seed

      - name: Generate client only
        if: github.event.inputs.migration_action == 'generate'
        run: pnpm prisma generate

      - name: Verify migration status
        run: pnpm prisma migrate status

      - name: Create backup info
        if: github.event.inputs.environment == 'production'
        run: |
          echo "🗄️ Database migration completed on production"
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Migration Action: ${{ github.event.inputs.migration_action }}"
          echo "Commit: ${{ github.sha }}"

      - name: Notify success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            ✅ Database migration successful!

            **Environment**: ${{ github.event.inputs.environment }}
            **Action**: ${{ github.event.inputs.migration_action }}
            **Triggered by**: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            ❌ Database migration failed!

            **Environment**: ${{ github.event.inputs.environment }}
            **Action**: ${{ github.event.inputs.migration_action }}
            **Triggered by**: ${{ github.actor }}

            Please check the logs and fix the issue.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
