<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In — Mirael</title>
    <meta name="description" content="Sign in to your Mirael account to continue your emotional reflection journey." />
    <meta property="og:title" content="Sign In — Mirael" />
    <meta property="og:description" content="Access your personal space for emotional reflection and clarity." />
    <meta property="og:type" content="website" />

    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "Inter",
                "ui-sans-serif",
                "system-ui",
                "Segoe UI",
                "Roboto",
                "Apple Color Emoji",
                "Segoe UI Emoji",
              ],
            },
            boxShadow: {
              card: "0 4px 20px rgba(0,0,0,0.08)",
              floating: "0 8px 30px rgba(0,0,0,0.12)",
              subtle: "0 2px 8px rgba(0,0,0,0.04)",
            },
          },
        },
      };
    </script>

    <!-- Design tokens via CSS variables for light/dark; used with Tailwind arbitrary values -->
    <style>
      :root {
        --bg-primary: #f5f3f0;
        --bg-card: #ffffff;
        --bg-accent: #ff6b5a;
        --bg-secondary: #2c2c2e;
        --bg-input: #f8f8f8;
        --bg-soft: #fff8f7;
        --bg-gradient: linear-gradient(135deg, #ff6b5a 0%, #ff8a7a 100%);

        --text-primary: #2c2c2e;
        --text-secondary: #8e8e93;
        --text-on-accent: #ffffff;

        --border-light: #e5e5e7;
      }
      .dark {
        --bg-primary: #1c1c1e;
        --bg-card: #2c2c2e;
        --bg-accent: #ff6b5a;
        --bg-secondary: #3a3a3c;
        --bg-input: #3a3a3c;
        --bg-soft: #2a2525;

        --text-primary: #ffffff;
        --text-secondary: #8e8e93;
        --text-on-accent: #ffffff;

        --border-light: #48484a;
      }
    </style>
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-primary)] antialiased min-h-screen flex flex-col">
    <!-- Header -->
    <header class="border-b border-[var(--border-light)]">
      <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
        <a href="#" class="font-extrabold text-xl tracking-tight">Mirael</a>
        <button
          id="themeToggle"
          class="w-10 h-10 rounded-full border border-[var(--border-light)] bg-[var(--bg-card)] flex items-center justify-center transition hover:scale-105"
          aria-label="Toggle theme"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="text-[var(--text-secondary)]"
          >
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-6 py-12">
      <div class="w-full max-w-md">
        <!-- Welcome Header -->
        <div class="text-center mb-8">
          <h1 class="text-3xl md:text-4xl font-extrabold leading-tight tracking-tight mb-3">Welcome back</h1>
          <p class="text-[var(--text-secondary)]">Continue your reflection journey</p>
        </div>

        <!-- Sign In Form -->
        <div class="rounded-2xl border border-[var(--border-light)] bg-[var(--bg-card)] p-8 shadow-card">
          <form id="signinForm" class="space-y-6">
            <!-- Email Field -->
            <div>
              <label for="email" class="block text-sm font-medium mb-2">Email address</label>
              <input
                type="email"
                id="email"
                name="email"
                required
                placeholder="you@example.com"
                class="w-full rounded-2xl border border-[var(--border-light)] bg-[var(--bg-input)] px-4 py-3 text-[var(--text-primary)] placeholder-[var(--text-secondary)] outline-none transition focus:border-[var(--bg-accent)] focus:ring-2 focus:ring-[var(--bg-accent)] focus:ring-opacity-20"
              />
            </div>

            <!-- Password Field -->
            <div>
              <label for="password" class="block text-sm font-medium mb-2">Password</label>
              <div class="relative">
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  placeholder="Enter your password"
                  class="w-full rounded-2xl border border-[var(--border-light)] bg-[var(--bg-input)] px-4 py-3 pr-12 text-[var(--text-primary)] placeholder-[var(--text-secondary)] outline-none transition focus:border-[var(--bg-accent)] focus:ring-2 focus:ring-[var(--bg-accent)] focus:ring-opacity-20"
                />
                <button
                  type="button"
                  id="togglePassword"
                  class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition"
                  aria-label="Toggle password visibility"
                >
                  <svg
                    id="eyeOpen"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg
                    id="eyeClosed"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    class="hidden"
                  >
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                    ></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Forgot Password -->
            <div class="text-right">
              <a href="#" class="text-sm text-[var(--bg-accent)] hover:underline">Forgot your password?</a>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="w-full rounded-2xl bg-[var(--bg-accent)] px-6 py-3 font-semibold text-white shadow transition hover:translate-y-[-1px] hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-[var(--bg-accent)] focus:ring-opacity-50"
            >
              Sign in
            </button>
          </form>
        </div>

        <!-- Sign Up Link -->
        <div class="text-center mt-6">
          <p class="text-[var(--text-secondary)]">
            Don't have an account?
            <a href="#" class="text-[var(--bg-accent)] font-medium hover:underline">Sign up</a>
          </p>
        </div>

        <!-- Privacy Note -->
        <div class="mt-8 p-4 rounded-xl bg-[var(--bg-soft)] border border-[rgba(255,107,90,0.15)]">
          <p class="text-sm text-[var(--text-secondary)] text-center">
            Your reflections are private by default. By signing in, you agree to our
            <a href="#" class="text-[var(--bg-accent)] hover:underline">Terms of Use</a> and
            <a href="#" class="text-[var(--bg-accent)] hover:underline">Privacy Policy</a>.
          </p>
        </div>
      </div>
    </main>

    <script>
      // Theme persistence
      const root = document.documentElement;
      const saved = localStorage.getItem("mirael-theme");
      if (saved === "dark") root.classList.add("dark");

      document.getElementById("themeToggle")?.addEventListener("click", () => {
        const isDark = root.classList.toggle("dark");
        localStorage.setItem("mirael-theme", isDark ? "dark" : "light");
      });

      // Password visibility toggle
      document.getElementById("togglePassword")?.addEventListener("click", () => {
        const password = document.getElementById("password");
        const eyeOpen = document.getElementById("eyeOpen");
        const eyeClosed = document.getElementById("eyeClosed");

        if (password.type === "password") {
          password.type = "text";
          eyeOpen.classList.add("hidden");
          eyeClosed.classList.remove("hidden");
        } else {
          password.type = "password";
          eyeOpen.classList.remove("hidden");
          eyeClosed.classList.add("hidden");
        }
      });

      // Form submission
      document.getElementById("signinForm")?.addEventListener("submit", (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const original = btn.textContent;

        btn.textContent = "Signing in...";
        btn.disabled = true;

        // Simulate API call
        setTimeout(() => {
          btn.textContent = "Signed in!";
          setTimeout(() => {
            btn.textContent = original;
            btn.disabled = false;
            // In real app, redirect to dashboard
          }, 1000);
        }, 1500);
      });
    </script>
  </body>
</html>
